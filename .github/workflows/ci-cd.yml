name: CI/CD

on:
  push:
    branches:
      - dev-001
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-cd
  cancel-in-progress: false

jobs:
  auto_merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Sync dev-001 into dev
        if: github.ref == 'refs/heads/dev-001'
        run: |
          git fetch origin dev dev-001
          git checkout dev
          git reset --hard origin/dev-001
          git push --force-with-lease origin dev

      - name: Sync dev into main
        run: |
          git fetch origin main dev
          git checkout main
          git reset --hard origin/dev
          git push --force-with-lease origin main

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate book-src from matrix and handbooks
        run: python3 codebase/site/scripts/build_mdbook.py

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08
        with:
          mdbook-version: "latest"

      - name: Build mdBook
        run: mdbook build codebase/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: codebase/site/book

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
