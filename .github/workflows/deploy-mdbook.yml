name: Deploy mdBook to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mdbook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate book-src from matrix and handbooks
        run: python3 codebase/site/scripts/build_mdbook.py

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08
        with:
          mdbook-version: "latest"

      - name: Build mdBook
        run: mdbook build codebase/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: codebase/site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
